server:
  servlet:
    context-path: /test

spring:
  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:h2:mem:test}
    username: ${JDBC_DATABASE_USERNAME:sa}
    password: ${JDBC_DATABASE_PASSWORD:password}
  mvc:
    servlet:
      load-on-startup: 1
  main:
    allow-bean-definition-overriding: true
  profiles:
    active: test
  security:
    oauth2:
      client:
        registration:
          canvas:
            client-id: client-123
            authorization-grant-type: implicit
            scope: openid
            redirect-uri: "{baseUrl}/lti/login"
        provider:
          canvas:
            authorization-uri: https://sso.canvaslms.com/api/lti/authorize_redirect
            token-uri: https://sso.canvaslms.com/login/oauth2/token
            jwk-set-uri: https://sso.canvaslms.com/api/lti/security/jwks
            user-name-attribute: sub

